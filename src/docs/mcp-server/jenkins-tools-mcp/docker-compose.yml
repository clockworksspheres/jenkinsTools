# JenkinsTools MCP Server
#
# Usage:
#   cp .env.example .env   # edit JENKINS_* values
#   docker compose up --build
#
# MCP endpoint:  http://localhost:8000/mcp
# Health:        http://localhost:8000/health

services:
  jenkins-tools-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: jenkins-tools-mcp:latest
    container_name: jenkins-tools-mcp
    ports:
      - "${MCP_PORT:-8000}:8000"
    environment:
      # Jenkins connection (override in .env or shell)
      JENKINS_URL: ${JENKINS_URL:-http://host.docker.internal:8080}
      JENKINS_USER: ${JENKINS_USER:-admin}
      JENKINS_TOKEN: ${JENKINS_TOKEN:-}
      # Server bind (already set in image; listed for clarity)
      MCP_TRANSPORT: http
      HOST: "0.0.0.0"
      PORT: "8000"
      JENKINS_TOOLS_SCRIPTS: /app/scripts/jenkinsTools
    # Optional: mount a host SSH key dir read-only for jenkins_add_ssh_credential
    # volumes:
    #   - ${HOME}/.ssh:/keys:ro
    extra_hosts:
      # Lets the container reach Jenkins on the host (Docker Desktop / Linux)
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
