[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jenkinsTools"
version = "0.0.35"
description = "RAM disk utilities"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]
# dynamic = ["dependencies", "optional-dependencies"]

[tool.setuptools.packages.find]
where = ["."]
include = ["jenkinsTools*"]

[project.scripts]
jenkinsNodeTool = "jenkinsTools.jenkinsNodeTool:main"
jenkinsPipelineTool = "jenkinsTools.jenkinsPipelineTool:main"
jenkinsToolsGui = "jenkinsTools.jenkinsToolsGui:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
# optional-dependencies = { dev = { file = ["requirements-dev.txt"] } }

