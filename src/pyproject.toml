[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jenkinsTools"
version = "2.0.34"
description = "RAM disk utilities"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["jenkinsTools*"]

[project.scripts]
jenkinsNodeTool = "jenkinsTools.jenkinsNodeTool:main"
jenkinsPipelineTool = "jenkinsTools.jenkinsPipelineTool:main"

